[project]
authors = [
    "Durrant Lab @ Pitt <durrantj@pitt.edu>",
]
channels = ["pytorch", "nvidia", "conda-forge"]
name = "censible"
description = "Predict small-molecule binding affinities using deep-learning context explanation networks."
platforms = ["linux-64"]
version = "1.2.0"
license = "Apache-2.0"
readme = "README.md"

[system-requirements]
cuda = "11.8"

[pypi-dependencies]
censible = { path = ".", editable = true }

[environments]
dev = ["dev"]
docs = ["docs"]

[tasks]

[dependencies]
python = ">=3.8,<3.14"
openbabel = { version = ">=3.1.1,<4", channel = "conda-forge" }
smina = { version = ">=2020.12.10,<2021", channel = "conda-forge" }
pytorch-cuda = { version = "==11.8", channel = "pytorch" }
cuda-version = { version = "==11.8", channel = "conda-forge" }
cudatoolkit = { version = "==11.8", channel = "conda-forge" }
molgrid = ">=0.5.2,<0.6"

[feature.dev.dependencies]
isort = ">=5.12.0"
pylint = ">=3.0.1"
mypy = ">=1.6.0"
pytest = ">=7.4.2"
pytest-cov = ">=4.1.0"
coverage = ">=7.3.1"
pytest-html = ">=4.0.1"
colorama = ">=0.4.6"
basedpyright = ">=1.29.1,<2"
ruff = ">=0.11.10,<0.12"
twine = ">=6.1.0,<7"

[feature.dev.tasks]
mdlint = { cmd = ["markdownlint-cli2", '"**/*.{md,markdown}"', "--fix", "--config", ".markdownlint.yaml", "||", "true"] }
isort = { cmd = ["isort", "--settings-path", ".isort.cfg", "./censible", "./tests", "||", "true"] }
black = { cmd = ["black", "--config", ".black.toml", "./censible", "./tests", "||", "true"] }
format = { depends-on = ["mdlint", "isort", "black"] }
tests = { cmd = [
    "PYTHONPATH=.",
    "pytest",
    "-c",
    ".pytest.ini",
    "--cov='censible'",
    "--cov-report=xml",
    "--junit-xml=report.xml",
    "--failed-first",
]}
coverage = { cmd = ["coverage", "report"] }
cleanup-build = { cmd = ["rm", "-rf", "./build"] }
build = { cmd = ["python3", "-m", "build"], depends-on = ["cleanup-build"]}
publish-test = { cmd = ["twine", "upload", "--repository", "testpypi", "dist/*"] }
publish = { cmd = ["twine", "upload", "dist/*"] }

[feature.dev.pypi-dependencies]
build = ">=1.2.2.post1,<2"
mypy-extensions = ">=1.0.0"
black = { version = ">=23.10.0", extras = ["jupyter"] }
pyrefly = ">=0.16.1, <1"

[feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.6.5,<10"
mkdocstrings = ">=0.28.2,<0.29"
mkdocstrings-python = ">=1.16.2,<2"
pymdown-extensions = ">=10.14.3,<11"
mkdocs-table-reader-plugin = ">=3.1.0,<4"
mkdocs-gen-files = ">=0.4.0,<0.5"
mkdocs-macros-plugin = ">=1.3.7,<2"
mkdocs-jupyter = ">=0.25.1,<0.26"
mkdocs-glightbox = ">=0.4.0,<0.5"
mkdocs-git-revision-date-localized-plugin = ">=1.2.9,<2"

[feature.docs.pypi-dependencies]
material-plausible-plugin = ">=0.2.0,<0.3"
mkdocs-print-site-plugin = ">=2.6.0,<3"
mkdocs-awesome-nav = ">=3.0.0,<4"

[feature.docs.tasks]
docs = { cmd = ["rm", "-rf", "./public/", "&&", "mkdocs", "build", "-d", "public/"] }
serve = { cmd = ["mkdocs", "serve"] }
